[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-ident"
version = "1.0.0"
description = "macOS image & video face scanner with multi-strata matching"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pillow>=10.4",
  "insightface>=0.7.3",
  "onnxruntime>=1.19",
]

[project.scripts]
strata-ident = "strata_ident.cli:main"

[tool.setuptools.packages.find]
include = ["strata_ident*"]
