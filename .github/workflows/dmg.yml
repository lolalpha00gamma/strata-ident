name: dmg

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "*.dmg"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build StrataIdent.app
        run: |
          set -euo pipefail
          xcodebuild \
            -project macos/StrataIdent.xcodeproj \
            -target StrataIdent \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: Package DMG
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products/Release -name 'StrataIdent.app' -type d | head -1)
          test -n "$APP"
          mkdir -p dist/stage
          ditto "$APP" dist/stage/StrataIdent.app
          codesign --force --deep --sign - dist/stage/StrataIdent.app || true
          ln -s /Applications dist/stage/Applications
          cat > dist/stage/LIESMICH.txt << 'TXT'
Strata Ident — macOS Gesichtsscanner

1. StrataIdent in den Ordner Programme ziehen.
2. Einmal: Rechtsklick auf StrataIdent → Öffnen
   (Gatekeeper, weil die App nicht mit einem Apple-Developer-Zertifikat signiert ist)
3. Fotos und Videos per Import oder Drag-and-Drop.
TXT
          hdiutil create \
            -volname "Strata Ident" \
            -srcfolder dist/stage \
            -ov -format UDZO \
            dist/StrataIdent.dmg
          ls -lh dist/StrataIdent.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrataIdent.dmg
          path: dist/StrataIdent.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.1"
          NOTES="macOS-App als Disk-Image. Rechtsklick → Öffnen, dann in Programme ziehen."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/StrataIdent.dmg --clobber
          else
            gh release create "$TAG" dist/StrataIdent.dmg --title "Strata Ident $TAG" --notes "$NOTES"
          fi

      - name: Commit DMG into the repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/StrataIdent.dmg
          if git diff --cached --quiet; then
            echo "no dmg change"
            exit 0
          fi
          git commit -m "StrataIdent.dmg für macOS"
          git push
